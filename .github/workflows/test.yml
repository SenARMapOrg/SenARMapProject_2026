name: Test

# push / Pull Request のたびに実行する。
# build-push.yml からも呼ばれ、テストが通らない限り本番イメージは作られない。
on:
  push:
    # main は build-push.yml がこのワークフローを呼ぶので、二重に走らせない
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  python:
    name: 経路探索API・ナビ画面のテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            deploy_env/python/requirements.txt
            programs/3D_Graph/requirements.txt
            programs/3D_Graph/requirements-dev.txt

      - name: 依存をインストール
        run: pip install -r programs/3D_Graph/requirements-dev.txt

      - name: pytest
        run: pytest

  data-check:
    name: データの確認
    runs-on: ubuntu-latest
    steps:
      # main のデータと比べるため、履歴ごと取得する
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            deploy_env/python/requirements.txt
            programs/3D_Graph/requirements.txt
            programs/3D_Graph/requirements-dev.txt

      - name: 依存をインストール
        run: pip install -r programs/3D_Graph/requirements-dev.txt

      # PR では向き先（main）の、ブランチへの push では main のデータと比べ、
      # 写真の消しすぎ・つながっていないノードの増加を見つける。
      # main への push（build-push.yml から呼ばれたとき）は比べない（PR の時点で比べている）
      - name: 比べる相手のデータを用意
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$REF" != "refs/heads/main" ]; then
            BASE="origin/main"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE:data" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE" data | tar -x -C "$RUNNER_TEMP/base"
            echo "BASE_DATA=$RUNNER_TEMP/base/data" >> "$GITHUB_ENV"
          fi

      # 結果はこの実行の「Summary」に表で出る
      - name: データの確認
        working-directory: programs/3D_Graph
        run: python check_data.py ${BASE_DATA:+--base "$BASE_DATA"}

  timetables:
    name: 時間割サービスのテスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/timetables
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: programs/timetables/package-lock.json

      - name: 依存をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: ビルドが通るか
        run: npm run build

  event-guide-counter:
    name: 鳳祭 案内人数集計のテスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/event_guide_counter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: programs/event_guide_counter/package-lock.json

      - name: 依存をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: ビルドが通るか
        run: npm run build

  navi-scripts:
    name: ナビ画面スクリプトの構文チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ナビ画面のJSはビルドを通さずそのまま配信されるため、
      # 構文エラーがあると本番でページごと動かなくなる
      - name: node --check
        run: |
          for f in programs/html/navi/script/*.js programs/html/embed/*.js programs/html/embed/builder/*.js; do
            echo "checking $f"
            node --check "$f"
          done
