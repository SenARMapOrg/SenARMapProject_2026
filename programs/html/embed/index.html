<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IKU NAVI 埋め込みマップ</title>
  <!-- 他のサイトに iframe で埋め込んで使うページ。使い方は /embed/builder/ と docs/API_Embed.md -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14181F">
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <link rel="stylesheet" href="/embed/embed.css">
</head>
<body>
  <header id="bar" class="bar">
    <span id="bar-plate" class="plate" hidden></span>
    <h1 id="bar-title" class="bar-title">読み込み中</h1>
    <button type="button" id="fullscreen" class="bar-btn" aria-label="全画面で見る" hidden>
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <a id="open-full" class="bar-btn open-full" href="https://iku-navi.net/navi/" target="_blank" rel="noopener"><span class="long">IKU NAVI で開く</span><span class="short" aria-hidden="true">開く</span></a>
  </header>

  <div class="layout">
    <main id="stage" class="stage">
      <div id="map" class="map" role="img" aria-label="フロアマップ"></div>
      <div id="notice" class="notice" hidden></div>
      <p id="banner" class="banner" hidden></p>
      <span id="north" class="north" aria-hidden="true" hidden>↑ 北</span>
      <div id="hint" class="hint" aria-hidden="true"></div>
      <div class="zoom" id="zoom" hidden>
        <button type="button" id="zoom-in" aria-label="拡大">＋</button>
        <button type="button" id="zoom-out" aria-label="縮小">－</button>
        <button type="button" id="zoom-fit" aria-label="最初の範囲に戻す"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="3.2" fill="currentColor"/><path d="M10 1.5v3.5M10 15v3.5M1.5 10H5M15 10h3.5" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>
      <nav id="floors" class="floors" aria-label="階" hidden></nav>
      <a id="credit" class="credit" href="https://iku-navi.net/" target="_blank" rel="noopener">IKU NAVI</a>
    </main>

    <aside id="steps" class="steps" aria-label="道順" hidden>
      <div class="seg-bar">
        <button type="button" id="seg-prev" class="seg-btn" aria-label="前の区間">◀</button>
        <div class="seg-body" aria-live="polite">
          <div class="seg-head"><span id="seg-count" class="seg-count"></span><span id="seg-title" class="seg-title"></span><span id="seg-dist" class="seg-dist"></span></div>
          <div id="seg-next" class="seg-next"></div>
        </div>
        <button type="button" id="seg-next-btn" class="seg-btn" aria-label="次の区間">▶</button>
      </div>
      <ol id="seg-list" class="seg-list"></ol>
    </aside>
  </div>

  <script src="/embed/core.js"></script>
  <script src="/embed/viewer.js"></script>
</body>
</html>
