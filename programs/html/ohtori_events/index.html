    <script>
      /*
  イベント情報の編集方法：
  name = イベント名
  description = 短い説明
  category = ジャンル（上のフィルター名と同じ表記）
  room = 教室・開催場所
  url = ナビプロジェクトのURL
*/
      const categoryStyles = {
        ライブ: { color: "red", icon: "🎤" },
        特別企画: { color: "purple", icon: "✨" },
        飲食: { color: "orange", icon: "🍜" },
        物販: { color: "pink", icon: "🛍️" },
        展示: { color: "blue", icon: "🎨" },
        体験: { color: "green", icon: "🎲" },
        音楽: { color: "purple", icon: "🎶" },
        出店: { color: "blue", icon: "🏪" },
        企画: { color: "pink", icon: "🧩" },
        その他: { color: "blue", icon: "📍" },
      };

      let events = [];
      function parseCSV(text) {
        // CSVの先頭にBOMがあれば削除する
        text = text.replace(/^\uFEFF/, "");

        const rows = [];
        let row = [];
        let field = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];

          if (inQuotes) {
            if (char === '"') {
              if (text[i + 1] === '"') {
                // "" は " として扱う
                field += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              field += char;
            }
          } else {
            if (char === '"' && field === "") {
              inQuotes = true;
            } else if (char === ",") {
              row.push(field);
              field = "";
            } else if (char === "\n" || char === "\r") {
              // Windows形式の改行（CRLF）にも対応
              if (char === "\r" && text[i + 1] === "\n") {
                i++;
              }

              row.push(field);

              // 空行は無視する
              if (row.some((value) => value.trim() !== "")) {
                rows.push(row);
              }

              row = [];
              field = "";
            } else {
              field += char;
            }
          }
        }

        // ファイル末尾のデータを処理する
        row.push(field);
        if (row.some((value) => value.trim() !== "")) {
          rows.push(row);
        }

        if (rows.length === 0) {
          return [];
        }

        const headers = rows.shift().map((header) => header.trim());

        // CSVの各行をオブジェクトに変換する
        return rows.map((values) => {
          const event = {};

          headers.forEach((header, index) => {
            event[header] = (values[index] ?? "").trim();
          });

          return event;
        });
      }

      async function loadEvents() {
        try {
          const response = await fetch("./ohtori_events.csv");

          if (!response.ok) {
            throw new Error("CSVファイルを読み込めませんでした");
          }

          const csvText = await response.text();

          events = parseCSV(csvText);
          renderEvents();
        } catch (error) {
          console.error(error);
          document.querySelector("#eventRows").innerHTML =
            `<tr><td colspan="4">イベント情報を読み込めませんでした。</td></tr>`;
        }
      }

      const rows = document.getElementById("eventRows");
      const searchInput = document.getElementById("searchInput");
      const resultCount = document.getElementById("resultCount");
      const emptyState = document.getElementById("emptyState");
      let activeCategory = "すべて";
      let activeDate = "すべて";

      function escapeHTML(value) {
        return String(value).replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }
      function safeURL(value) {
        try {
          const u = new URL(value);
          return u.protocol === "https:" || u.protocol === "http:"
            ? u.href
            : "";
        } catch {
          return "";
        }
      }
      function renderEvents() {
        const query = searchInput.value.trim().toLocaleLowerCase("ja");
        const filtered = events.filter((event) => {
          const matchesCategory =
            activeCategory === "すべて" || event.category === activeCategory;
          const dates = (event.dates || "").split(";");
          const matchesDate =
            activeDate === "すべて" || dates.includes(activeDate);
          const searchable =
            `${event.name} ${event.description} ${event.category} ${event.room}`.toLocaleLowerCase(
              "ja",
            );
          return matchesCategory && matchesDate && searchable.includes(query);
        });
        resultCount.textContent = filtered.length;
        rows.innerHTML = filtered
          .map((event) => {
            const url = safeURL(event.url);
            const style =
              categoryStyles[event.category] || categoryStyles["その他"];
            return `<tr>
      <td><div class="event-cell">
        <div class="thumb ${escapeHTML(style.color)}" aria-hidden="true">${escapeHTML(style.icon)}</div>
        <div><div class="event-name">${escapeHTML(event.name)}</div><div class="event-desc">${escapeHTML(event.description)}</div></div>
      </div></td>
      <td><span class="tag ${escapeHTML(style.color)}">${escapeHTML(event.category)}</span></td>
      <td><div class="location"><span class="pin">●</span><span>${escapeHTML(event.room)}</span></div></td>
      <td style="text-align:center">${
        url
          ? `<a class="nav-btn" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer"><span>➤</span> ナビする</a>`
          : `<span style="font-size:11px;color:#9b9c8d">URL未設定</span>`
      }</td>
    </tr>`;
          })
          .join("");
        emptyState.style.display = filtered.length ? "none" : "block";
      }
      document.getElementById("filters").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        document
          .querySelectorAll("#filters .filter")
          .forEach((b) => b.classList.toggle("active", b === button));
        renderEvents();
      });
      document
        .getElementById("dateFilters")
        .addEventListener("click", (event) => {
          const button = event.target.closest("button[data-date]");
          if (!button) return;
          activeDate = button.dataset.date;
          document
            .querySelectorAll("#dateFilters .date-filter")
            .forEach((b) => b.classList.toggle("active", b === button));
          renderEvents();
        });
      searchInput.addEventListener("input", renderEvents);
      loadEvents();
    </script>
  </body>
</html>
