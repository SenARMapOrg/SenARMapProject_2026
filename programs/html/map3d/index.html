<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="専修大学 生田キャンパスの建物・通路・階段を3Dで見られるマップ。教室を選ぶと、道順を3Dで表示します。">
  <title>3Dキャンパスマップ | IKU NAVI</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="map3d.css">
</head>
<body>
  <canvas id="scene" aria-label="キャンパスの3Dマップ"></canvas>

  <header class="panel" id="panel">
    <div class="panel-head">
      <a class="brand" href="/">IKU NAVI</a>
      <span class="brand-sub">3Dキャンパスマップ</span>
      <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">閉じる</button>
    </div>

    <div class="panel-body" id="panel-body">
      <form class="route-form" id="route-form">
        <label>出発
          <select id="from-room" required><option value="">教室を選ぶ</option></select>
        </label>
        <label>目的地
          <select id="to-room" required><option value="">教室を選ぶ</option></select>
        </label>
        <div class="route-actions">
          <label class="check"><input type="checkbox" id="use-elevator" checked> エレベーターを使う</label>
          <button type="submit" class="btn-primary">道順を見る</button>
        </div>
      </form>
      <p class="route-summary" id="route-summary" hidden></p>

      <div class="controls">
        <div class="control-row">
          <span class="control-label">建物</span>
          <div class="chips" id="building-chips"></div>
        </div>
        <div class="control-row" id="floor-row" hidden>
          <span class="control-label">階</span>
          <div class="chips" id="floor-chips"></div>
        </div>
        <label class="control-row">
          <span class="control-label">高さの強調</span>
          <input type="range" id="spread" min="1" max="4" step="0.1" value="1.8">
        </label>
        <div class="control-row toggles">
          <label class="check"><input type="checkbox" id="show-labels" checked> 教室名</label>
          <label class="check"><input type="checkbox" id="auto-rotate"> 自動で回る</label>
        </div>
      </div>

      <ul class="legend">
        <li><span class="swatch corridor"></span>通路</li>
        <li><span class="swatch stairs"></span>階段</li>
        <li><span class="swatch elevator"></span>エレベーター</li>
        <li><span class="swatch escalator"></span>エスカレーター</li>
        <li><span class="swatch outdoor"></span>屋外の道</li>
        <li><span class="swatch route"></span>道順</li>
        <li id="legend-photo" hidden><span class="swatch photo"></span>写真あり</li>
      </ul>
      <p class="hint">ドラッグで回転、右ドラッグ（2本指）で移動、ホイール・ピンチで拡大縮小。建物名をタップすると、その建物に寄ります。</p>
    </div>
  </header>

  <div class="status" id="status">読み込み中…</div>

  <button type="button" class="map-btn" id="photo-mode" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>
    <span id="photo-mode-label">写真で見る</span>
  </button>

  <!-- 通路の写真。スマートフォンは写真1枚と矢印（スワイプでも移れる）、パソコンは前後左右の行き先の写真も周りに並べる -->
  <section class="photo-viewer" id="photo-viewer" hidden aria-label="通路の写真">
    <div class="photo-grid">
      <div class="photo-frame" id="photo-frame">
        <img id="photo-img" alt="">
        <p class="photo-empty" id="photo-empty" hidden></p>
        <div class="photo-caption">
          <strong id="photo-title"></strong>
          <span id="photo-rooms"></span>
        </div>
        <button type="button" class="photo-icon photo-close" id="photo-close" aria-label="写真を閉じる" title="閉じる（Esc）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button type="button" class="photo-arrow forward" data-move="forward" aria-label="前へ" title="前へ（↑）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5l7-7 7 7"/></svg></button>
        <button type="button" class="photo-arrow back" data-move="back" aria-label="後ろへ" title="後ろへ（↓）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5l7-7 7 7"/></svg></button>
        <button type="button" class="photo-arrow left" data-move="left" aria-label="左へ" title="左へ（←）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5l7-7 7 7"/></svg></button>
        <button type="button" class="photo-arrow right" data-move="right" aria-label="右へ" title="右へ（→）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5l7-7 7 7"/></svg></button>
      </div>
      <button type="button" class="photo-thumb forward" data-move="forward" data-thumb="forward" title="前へ（↑）"><img alt=""><span class="photo-thumb-label">前へ</span><span class="photo-thumb-empty">写真なし</span></button>
      <button type="button" class="photo-thumb left" data-move="left" data-thumb="left" title="左へ（←）"><img alt=""><span class="photo-thumb-label">左へ</span><span class="photo-thumb-empty">写真なし</span></button>
      <button type="button" class="photo-thumb right" data-move="right" data-thumb="right" title="右へ（→）"><img alt=""><span class="photo-thumb-label">右へ</span><span class="photo-thumb-empty">写真なし</span></button>
      <button type="button" class="photo-thumb back" data-move="back" data-thumb="back" title="後ろへ（↓）"><img alt=""><span class="photo-thumb-label">後ろへ</span><span class="photo-thumb-empty">写真なし</span></button>
    </div>
    <div class="photo-bar">
      <button type="button" class="photo-btn" data-move="up" title="上の階へ（PageUp）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></svg>上の階</button>
      <button type="button" class="photo-btn" data-move="down" title="下の階へ（PageDown）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5"/></svg>下の階</button>
      <button type="button" class="photo-btn" data-move="flip" title="反対向きを見る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.05-4.95M5 4v4h4"/></svg>振り返る</button>
      <button type="button" class="photo-btn photo-expand" id="photo-expand" aria-pressed="false" title="大きく表示">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="photo-expand-label">大きく</span></button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
  <script src="map3d.js"></script>
</body>
</html>
