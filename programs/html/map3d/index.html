<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="専修大学 生田キャンパスの建物・通路・階段を3Dで見られるマップ。教室を選ぶと、道順を3Dで表示します。">
  <title>3Dキャンパスマップ | IKU NAVI</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="map3d.css">
</head>
<body>
  <canvas id="scene" aria-label="キャンパスの3Dマップ"></canvas>

  <header class="panel" id="panel">
    <div class="panel-head">
      <a class="brand" href="/">IKU NAVI</a>
      <span class="brand-sub">3Dキャンパスマップ</span>
      <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">閉じる</button>
    </div>

    <div class="panel-body" id="panel-body">
      <form class="route-form" id="route-form">
        <label>出発
          <select id="from-room" required><option value="">教室を選ぶ</option></select>
        </label>
        <label>目的地
          <select id="to-room" required><option value="">教室を選ぶ</option></select>
        </label>
        <div class="route-actions">
          <label class="check"><input type="checkbox" id="use-elevator" checked> エレベーターを使う</label>
          <button type="submit" class="btn-primary">道順を見る</button>
        </div>
      </form>
      <p class="route-summary" id="route-summary" hidden></p>

      <div class="controls">
        <div class="control-row">
          <span class="control-label">建物</span>
          <div class="chips" id="building-chips"></div>
        </div>
        <div class="control-row" id="floor-row" hidden>
          <span class="control-label">階</span>
          <div class="chips" id="floor-chips"></div>
        </div>
        <label class="control-row">
          <span class="control-label">高さの強調</span>
          <input type="range" id="spread" min="1" max="4" step="0.1" value="1.8">
        </label>
        <div class="control-row toggles">
          <label class="check"><input type="checkbox" id="show-labels" checked> 教室名</label>
          <label class="check"><input type="checkbox" id="auto-rotate"> 自動で回る</label>
        </div>
      </div>

      <ul class="legend">
        <li><span class="swatch corridor"></span>通路</li>
        <li><span class="swatch stairs"></span>階段</li>
        <li><span class="swatch elevator"></span>エレベーター</li>
        <li><span class="swatch escalator"></span>エスカレーター</li>
        <li><span class="swatch outdoor"></span>屋外の道</li>
        <li><span class="swatch route"></span>道順</li>
        <li id="legend-photo" hidden><span class="swatch photo"></span>写真あり</li>
      </ul>
      <p class="hint">ドラッグで回転、右ドラッグ（2本指）で移動、ホイール・ピンチで拡大縮小。建物名をタップすると、その建物に寄ります。</p>
    </div>
  </header>

  <div class="status" id="status">読み込み中…</div>

  <button type="button" class="map-btn" id="photo-mode" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>
    <span id="photo-mode-label">写真で見る</span>
  </button>

  <!-- 写真を見る画面。地図とは別のページのように画面いっぱいに出し、地図は左下に小さく出す。
       ブラウザの「戻る」・左上のボタン・小さな地図のタップで地図に戻る。URL（#photo=from_to）で場所を共有できる -->
  <section class="pv" id="photo-viewer" hidden aria-label="通路の写真">
    <!-- 写真は2枚を重ねて、移るときに寄る・横に流れるなどのアニメーションでつなぐ（中身は map3d.js が作る）。
         写真をタップ・クリックするとその方向へ進み、ドラッグすると指について動く -->
    <div class="pv-stage" id="photo-frame">
      <div class="pv-layers" id="photo-layers"></div>
      <div class="pv-spinner" id="photo-spinner" hidden></div>
      <!-- 床に寝かせた矢印。行き先の実際の向き（--a）に置く -->
      <div class="pv-ground" id="photo-ground">
        <span class="pv-ring" aria-hidden="true"></span>
        <button type="button" class="photo-arrow" data-move="forward" aria-label="前へ" title="前へ（↑）"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 34L24 14l16 20-16-8z"/></svg></button>
        <button type="button" class="photo-arrow" data-move="left" aria-label="左へ" title="左へ（←）"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 34L24 14l16 20-16-8z"/></svg></button>
        <button type="button" class="photo-arrow" data-move="right" aria-label="右へ" title="右へ（→）"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 34L24 14l16 20-16-8z"/></svg></button>
        <button type="button" class="photo-arrow" data-move="back" aria-label="後ろへ" title="後ろへ（↓）"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 34L24 14l16 20-16-8z"/></svg></button>
      </div>
      <p class="pv-hint" id="photo-hint" hidden></p>
    </div>

    <header class="pv-top">
      <button type="button" class="pv-back" id="photo-close" title="地図に戻る（Esc）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>地図</span>
      </button>
      <div class="pv-place">
        <strong id="photo-title"></strong>
        <span id="photo-rooms"></span>
      </div>
    </header>

    <nav class="pv-bar" aria-label="階の移動と向き">
      <button type="button" class="pv-btn" data-move="up" title="上の階へ（PageUp）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></svg><span>上の階</span></button>
      <button type="button" class="pv-btn" data-move="down" title="下の階へ（PageDown）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5"/></svg><span>下の階</span></button>
      <button type="button" class="pv-btn" data-move="flip" title="反対向きを見る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.05-4.95M5 4v4h4"/></svg><span>振り返る</span></button>
    </nav>

    <!-- パソコンだけ: 行き先の写真（押すとそこへ移る） -->
    <div class="pv-thumbs" aria-label="行き先の写真">
        <button type="button" class="pv-thumb" data-move="forward" data-thumb="forward" title="前へ（↑）"><img alt=""><span class="pv-thumb-label">前へ</span><span class="pv-thumb-empty">写真なし</span></button>
        <button type="button" class="pv-thumb" data-move="left" data-thumb="left" title="左へ（←）"><img alt=""><span class="pv-thumb-label">左へ</span><span class="pv-thumb-empty">写真なし</span></button>
        <button type="button" class="pv-thumb" data-move="right" data-thumb="right" title="右へ（→）"><img alt=""><span class="pv-thumb-label">右へ</span><span class="pv-thumb-empty">写真なし</span></button>
        <button type="button" class="pv-thumb" data-move="back" data-thumb="back" title="後ろへ（↓）"><img alt=""><span class="pv-thumb-label">後ろへ</span><span class="pv-thumb-empty">写真なし</span></button>
    </div>

    <span class="pv-mini-label" aria-hidden="true">地図に戻る</span>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
  <script src="map3d.js"></script>
</body>
</html>
