<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="専修大学 生田キャンパスの教室検索ナビ。出発と目的地の教室名を入れるだけで、階段・エレベーターまで考えた最短ルートを、実際の通路の写真と矢印で道案内します。最寄りのトイレ・食堂の検索、屋外からの案内、音声案内にも対応。インストール不要です。">
  <title>教室検索ナビ — 専修大学 生田キャンパスの教室まで写真で道案内 | IKU NAVI</title>
  <link rel="canonical" href="https://iku-navi.net/navi/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IKU NAVI">
  <meta property="og:title" content="教室検索ナビ — 専修大学 生田キャンパスの教室まで写真で道案内 | IKU NAVI">
  <meta property="og:description" content="教室名を入れるだけで、教室までの最短ルートを通路の写真と矢印で道案内。トイレ・食堂の検索にも対応しています。">
  <meta property="og:url" content="https://iku-navi.net/navi/">
  <meta property="og:image" content="https://iku-navi.net/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "IKU NAVI 教室検索ナビ", "url": "https://iku-navi.net/navi/", "description": "専修大学 生田キャンパスの教室検索ナビ。出発と目的地の教室名を入れるだけで、階段・エレベーターまで考えた最短ルートを、実際の通路の写真と矢印で道案内します。最寄りのトイレ・食堂の検索、屋外からの案内、音声案内にも対応。インストール不要です。", "applicationCategory": "TravelApplication", "operatingSystem": "iOS, Android, Windows, macOS（ブラウザで動作）", "inLanguage": "ja", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}, "about": {"@type": "Place", "name": "専修大学 生田キャンパス"}, "creator": {"@type": "Organization", "name": "生亀プロジェクト（専修大学 ネットワーク情報学部）"}}</script>
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#14181F">
  <!-- 文字は読みやすさを重視した UD フォント、教室番号・階・手順の数字だけ細身の数字書体（案内板の数字） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script/config.js"></script>
</head>
<body>

<!-- ================================================================
     Sidebar: search + nav + AR
     Mobile: display:contents — children participate in body flex via order
     Desktop: display:flex column, fixed 340px left panel
================================================================ -->
<div id="sidebar">

  <div id="app-header">
    <a href="../index.html" class="hdr-title">IKU NAVI</a>
    <span class="hdr-sub">教室検索ナビ</span>
    <a class="hdr-link" href="../map3d/">3Dマップ</a>
  </div>

  <!-- Search Panel -->
  <div id="search-panel">
    <div id="search-header">
      <a id="btn-home" href="../index.html" aria-label="トップページに戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5L12 5l8 6.5M6.5 9.8V19h11V9.8"/></svg></a>
      <div class="category-tabs">
        <button class="category-tab active" id="cat-room"     onclick="setCategory('room')">教室</button>
        <button class="category-tab"        id="cat-facility" onclick="setCategory('facility')">トイレ・食堂</button>
      </div>
      <span id="event-badge">&#127914; イベント</span>
      <button id="search-toggle" onclick="toggleSearchPanel()" aria-label="検索パネルを開閉">
        <span id="search-chevron" class="open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></span>
      </button>
    </div>

    <div id="search-content" class="open">
      <div class="search-content-inner">

        <!-- 教室カテゴリ -->
        <div id="cat-content-room">
        <div class="search-tabs">
          <button class="search-tab active" id="tab-room" onclick="setMode('room')">教室から</button>
          <button class="search-tab"        id="tab-gps"  onclick="setMode('gps')">現在地（屋外）から</button>
        </div>

        <!-- 出発と目的地を縦に並べ、入れ替えボタンは右に（乗換案内と同じ並び） -->
        <div id="panel-room">
          <div class="route-pair">
            <div class="route-pair-rows">
              <div class="route-row">
                <span class="route-label from">出発</span>
                <select class="building-select" id="from-bldg" aria-label="出発の建物">
                  <option value="">全建物</option>
                </select>
                <div class="ac-wrap">
                  <input id="from-input" placeholder="教室名（例: 10301）" autocomplete="off" aria-label="出発の教室">
                  <div class="suggestions" id="from-sugg"></div>
                </div>
              </div>
              <div class="route-row">
                <span class="route-label to">目的地</span>
                <select class="building-select" id="to-bldg" aria-label="目的地の建物">
                  <option value="">全建物</option>
                </select>
                <div class="ac-wrap">
                  <input id="to-input" placeholder="教室名" autocomplete="off" aria-label="目的地の教室">
                  <div class="suggestions" id="to-sugg"></div>
                </div>
              </div>
            </div>
            <button class="btn-swap" onclick="swapFromTo()" title="出発と目的地を入れ替える" aria-label="出発と目的地を入れ替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v15M4.5 15.5L8 19l3.5-3.5M16 20V5M12.5 8.5L16 5l3.5 3.5"/></svg></button>
          </div>
        </div>

        <div id="panel-gps" style="display:none">
          <div class="gps-wrapper">
            <div class="gps-row">
              <span id="gps-text">現在地はまだ取得していません</span>
              <button class="btn-gps" onclick="captureGPS()">現在地を取得</button>
            </div>
            <div id="accuracy-warn"></div>
          </div>
          <div class="route-row">
            <span class="route-label to">目的地</span>
            <select class="building-select" id="gps-to-bldg" aria-label="目的地の建物">
              <option value="">全建物</option>
            </select>
            <div class="ac-wrap">
              <input id="to-input-gps" placeholder="教室名" autocomplete="off" aria-label="目的地の教室">
              <div class="suggestions" id="gps-to-sugg"></div>
            </div>
          </div>
        </div>

        <div class="bottom-row">
          <label class="ev-label">
            <input type="checkbox" id="use-elevator" checked>
            エレベーターを使う
          </label>
          <button id="btn-search" onclick="doSearch()">ルート検索</button>
        </div>
        </div><!-- /#cat-content-room -->

        <!-- 設備検索カテゴリ -->
        <div id="cat-content-facility" style="display:none">

          <!-- モードタブ -->
          <div class="search-tabs">
            <button class="search-tab active" id="fac-tab-room" onclick="setFacMode('room')">教室から</button>
            <button class="search-tab"        id="fac-tab-gps"  onclick="setFacMode('gps')">現在地（屋外）から</button>
          </div>

          <!-- 教室モード: 出発(教室) -->
          <div id="panel-fac-room">
            <div class="route-row">
              <span class="route-label from">出発</span>
              <select class="building-select" id="fac-from-bldg" aria-label="出発の建物"><option value="">全建物</option></select>
              <div class="ac-wrap">
                <input id="fac-from-input" placeholder="教室名（例: 10301）" autocomplete="off" aria-label="出発の教室">
                <div class="suggestions" id="fac-from-sugg"></div>
              </div>
            </div>
          </div>

          <!-- GPSモード: 現在地取得 -->
          <div id="panel-fac-gps" style="display:none">
            <div class="gps-wrapper">
              <div class="gps-row">
                <span id="fac-gps-text">現在地はまだ取得していません</span>
                <button class="btn-gps" onclick="captureFacGPS()">現在地を取得</button>
              </div>
              <div id="fac-accuracy-warn"></div>
            </div>
          </div>

          <!-- 目的: 常に表示 -->
          <div class="route-row">
            <span class="route-label to">探す</span>
            <select class="building-select" id="fac-category" onchange="onFacCategoryChange()" aria-label="探す設備">
              <option value="toilet">トイレ</option>
              <option value="cafeteria">食堂</option>
            </select>
            <select class="fac-select" id="fac-toilet-type" aria-label="トイレの種類">
              <option value="all">全て</option>
              <option value="M">男子トイレ</option>
              <option value="F">女子トイレ</option>
              <option value="C">多目的トイレ</option>
            </select>
            <select class="fac-select" id="fac-cafeteria-name" aria-label="食堂" style="display:none">
              <option value="all">全て</option>
            </select>
          </div>

          <div class="bottom-row">
            <label class="ev-label">
              <input type="checkbox" id="fac-use-elevator" checked>エレベーターを使う
            </label>
            <button id="btn-fac-search" onclick="doFacSearch()">いちばん近くを探す</button>
          </div>
        </div><!-- /#cat-content-facility -->

      </div>
    </div>
  </div>

  <!-- AR / Camera Area -->
  <div id="ar-area">
    <video id="ar-bg-video" autoplay playsinline muted></video>
    <canvas id="ar-gl-canvas"></canvas>
    <div id="ar-cache"></div><!-- prefetch済み <img> がここに積まれる -->
    <div id="ar-placeholder">
      <div class="ph-text">道順の写真がここに出ます</div>
      <div class="arrival-icon" style="display:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="arrival-title" style="display:none">目的地に着きました</div>
      <div class="arrival-desc" style="display:none">案内はここまでです。</div>
    </div>
    <div id="ar-label">進行方向</div>
    <img id="direction-arrow" src="" alt="方向矢印">
    <div id="near-goal-badge">この通路沿いが目的地周辺です</div>
    <!-- ステップ操作: 画像上のオーバーレイ -->
    <div id="step-info">
      <div id="step-label">ルートを検索してください</div>
      <div id="step-count"></div>
    </div>
    <button class="nav-arrow" id="prev-btn" onclick="prevStep()" disabled aria-label="前の手順"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <button class="nav-arrow" id="next-btn" onclick="nextStep()" disabled aria-label="次の手順"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
    <button id="voice-toggle-btn" onclick="toggleVoiceGuide()" title="音声案内" aria-label="音声案内" aria-pressed="false"></button>
  </div>

</div><!-- /#sidebar -->

<!-- Map / SVG — full height on desktop, flex:1 on mobile -->
<div id="map-area">
  <div id="map"></div>
  <div id="svg-area">
    <div id="floor-badge"></div>
    <div id="svg-container"></div>
  </div>
</div>

<!-- ================================================================
     Completion modal — ナビ終了時に表示
================================================================ -->
<div id="completion-modal">
  <div id="completion-box">
    <div class="modal-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="modal-title">目的地に着きました</div>
    <p class="modal-desc">案内はここまでです。使ってみた感想を聞かせてください。</p>
    <!-- ↓ アンケートURLをここに設定してください -->
    <a class="modal-btn-survey" href="https://docs.google.com/forms/d/e/1FAIpQLScPw9uoXzk2AiQamOm-zchGnQrmi9lcSFvonsVjFDnMIhU7Dg/viewform?usp=sharing&ouid=117616783174955140351" target="_blank" rel="noopener">
      アンケートに答える
    </a>
    <button class="modal-btn-continue" onclick="closeCompletionModal()">ナビに戻る</button>
  </div>
</div>

<div id="loading"><div id="loading-box"><span class="spinner" aria-hidden="true"></span>道順を探しています</div></div>

<script src="script/state.js"></script>
<script src="script/track.js"></script>
<script src="script/data.js"></script>
<script src="script/search-form.js"></script>
<script src="script/gps.js"></script>
<script src="script/route.js"></script>
<script src="script/voice.js"></script>
<script src="script/photo.js"></script>
<script src="script/map.js"></script>
<script src="script/floormap.js"></script>
<script src="script/page.js"></script>

<script src="script/ar.js"></script>

<script src="script/maps-loader.js"></script>
</body>
</html>
